<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>需求详情追踪 - 戴维斯设计需求管理中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/global.css">
</head>
<body class="flex h-screen overflow-hidden relative selection:bg-indigo-500/30 text-zinc-300">

    <div class="absolute inset-0 bg-[#09090b] z-0 pointer-events-none"></div>
    <div id="dynamic-glow" class="glow-bg bg-sky-900/10"></div>

    <aside class="w-[240px] border-r border-white/5 flex flex-col z-10 bg-[#09090b] shrink-0 h-full">
        <div class="p-7 border-b border-white/5 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center shadow-[0_0_15px_rgba(79,70,229,0.3)] shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                </div>
                <h1 class="text-[15px] font-bold text-white tracking-wide">方案流转中心</h1>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-5 space-y-2">
            <button onclick="window.location.href='index.html'" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl bg-white/10 text-white hover:bg-white/20 transition-all btn-press shadow-sm">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
                <span class="font-bold text-[14px]">返回排号大厅</span>
            </button>
        </div>

        <div class="px-5 py-5 mt-auto border-t border-white/5 bg-[#09090b] shrink-0 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div id="sidebar-avatar" class="w-9 h-9 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-white font-bold text-sm shadow-lg">?</div>
                <div><p id="sidebar-name" class="text-xs font-bold text-white mb-0.5">加载中...</p><p id="sidebar-role" class="text-[10px] text-zinc-500">读取身份中</p></div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative z-10 bg-[#0c0c0e]">
        <header class="px-10 py-6 border-b border-white/5 bg-[#09090b]/80 backdrop-blur-xl shrink-0 flex items-center justify-between">
            <div>
                <div class="flex items-center gap-4">
                    <div id="header-id-badge" class="bg-zinc-800 border border-zinc-700 px-3 py-1.5 rounded-lg flex items-center gap-2">
                        <span class="text-zinc-300 font-mono text-sm font-bold" id="req-id">读取中...</span>
                    </div>
                    <h2 class="text-[22px] font-bold text-white tracking-tight" id="req-title-display">正在同步需求数据...</h2>
                    <span id="header-status-badge" class="hidden px-2.5 py-1 rounded text-[11px] font-bold flex items-center gap-1.5 transition-colors">状态读取中</span>
                </div>
            </div>
            <div class="flex items-center gap-5 relative">
                <span class="text-indigo-400 font-bold flex items-center gap-1.5 text-[13px] bg-indigo-500/10 px-3 py-1.5 rounded-lg border border-indigo-500/20" id="header-identity-tag">识别身份中...</span>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto custom-scrollbar p-10 flex justify-center scroll-smooth" id="main-scroll-area">
            <div class="w-full max-w-[1400px] flex gap-10 items-start">
                <div class="flex-1 flex flex-col gap-6 min-w-0 pb-10">
                    <section id="request-detail-section" class="bg-[#121217] border border-white/5 rounded-2xl p-8 relative overflow-hidden transition-opacity hover:border-indigo-500/20">
                        <div class="absolute right-0 top-0 bg-white/5 text-zinc-500 text-[10px] font-bold px-3 py-1 rounded-bl-xl border-l border-b border-white/5">1. 原始需求</div>
                        <div class="grid grid-cols-4 gap-4 mb-6 pb-6 border-b border-white/5">
                            <div><p class="text-[11px] text-zinc-500 mb-1">归属项目</p><p class="text-[13px] font-bold text-zinc-300 truncate" id="dt-project">--</p></div>
                            <div><p class="text-[11px] text-zinc-500 mb-1">期望交付日</p><p class="text-[13px] font-bold text-sky-400" id="dt-date">--</p></div>
                            <div><p class="text-[11px] text-zinc-500 mb-1">发起人</p><p class="text-[13px] font-bold text-zinc-300" id="dt-creator">--</p></div>
                            <div><p class="text-[11px] text-zinc-500 mb-1">执行人</p><p class="text-[13px] font-bold text-orange-400" id="dt-assignee">--</p></div>
                        </div>
                        <h3 class="text-sm font-bold text-white mb-3">📋 提单详细描述</h3>
                        <div class="text-[13px] text-zinc-400 leading-relaxed bg-[#09090b] border border-white/5 p-5 rounded-xl min-h-[60px]" id="req-desc-display">数据读取中...</div>
                        <div class="mt-4 space-y-3">
                            <div id="dt-link-container" class="hidden text-[12px] bg-[#09090b] border border-white/5 p-3 rounded-xl flex items-center gap-2">
                                <span class="text-zinc-500">🔗 参考链接：</span><span id="dt-link" class="truncate text-sky-400"></span>
                            </div>
                            <div id="attachment-container"></div>
                        </div>
                    </section>

                    <section id="required-assets-detail-panel" class="bg-[#121217] border border-orange-500/20 rounded-2xl p-7 relative overflow-hidden">
                        <div class="flex justify-between gap-4 items-start mb-5"><div><h3 class="text-sm font-bold text-white">🧩 必用设计素材</h3><p class="text-[11px] text-zinc-500 mt-1">展示必须真实用于设计的 IP、Logo、人物、主视觉和产品素材。</p></div><span id="required-assets-detail-count" class="text-xs text-orange-300"></span></div>
                        <div id="required-assets-detail-grid" class="grid grid-cols-2 lg:grid-cols-3 gap-3"></div>
                        <div class="mt-4 rounded-xl border border-dashed border-orange-500/30 bg-orange-500/[0.04] p-4">
                            <label class="cursor-pointer block text-center"><span class="text-xs font-bold text-orange-300">＋ 添加必用素材</span><input id="required-assets-detail-input" type="file" multiple accept="image/*" class="hidden"></label>
                            <div id="required-assets-pending-grid" class="grid grid-cols-2 lg:grid-cols-3 gap-3 mt-3"></div>
                            <button id="required-assets-detail-save" class="hidden mt-3 w-full py-2.5 rounded-xl bg-orange-600 hover:bg-orange-500 text-white text-xs font-bold">保存素材</button>
                        </div>
                    </section>

                    <section id="visual-reference-detail-panel" class="bg-[#121217] border border-indigo-500/20 rounded-2xl p-7 relative overflow-hidden">
                        <div class="flex justify-between gap-4 items-start mb-5"><div><h3 class="text-sm font-bold text-white">🎨 视觉参考 / 风格参考</h3><p class="text-[11px] text-zinc-500 mt-1">展示本次需求采用的视觉和风格参考。</p></div><span id="visual-reference-detail-count" class="text-xs text-indigo-300"></span></div>
                        <div id="visual-reference-detail-grid" class="grid grid-cols-2 lg:grid-cols-3 gap-3"></div>
                        <div id="visual-reference-detail-upload" class="mt-4 rounded-xl border border-dashed border-indigo-500/30 bg-indigo-500/[0.04] p-4">
                            <label class="cursor-pointer block text-center"><span class="text-xs font-bold text-indigo-300">＋ 添加参考图</span><input id="visual-reference-detail-input" type="file" multiple accept="image/*" class="hidden"></label>
                            <div id="visual-reference-pending-grid" class="grid grid-cols-2 lg:grid-cols-3 gap-3 mt-3"></div>
                            <button id="visual-reference-detail-save" class="hidden mt-3 w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold">保存参考图</button>
                        </div>
                    </section>

                    <section id="ai-requirement-panel" class="hidden bg-[#121217] border border-indigo-500/20 rounded-2xl p-8 relative overflow-hidden">
                        <div class="absolute right-0 top-0 bg-indigo-500/10 text-indigo-300 text-[10px] font-bold px-3 py-1 rounded-bl-xl border-l border-b border-indigo-500/20">AI 设计沟通区</div>
                        <div id="ai-requirement-content" class="text-sm text-zinc-400">正在读取 AI 状态...</div>
                    </section>

                    <section id="version-history-block" class="hidden mt-4">
                        <h3 class="text-[16px] font-bold text-white mb-4 flex items-center gap-2">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                            设计师历史交付版本库
                        </h3>
                        <div id="version-history-container" class="space-y-4"></div>
                    </section>
                </div>

                <div class="w-[380px] shrink-0 flex flex-col gap-6 sticky top-0 pb-10">
                    <section id="acceptance-panel" class="bg-[#121217] border border-white/5 rounded-3xl p-7 shadow-2xl relative overflow-hidden transition-all duration-300">
                        <div class="text-center py-6 text-zinc-500 text-sm">验收状态读取中...</div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <div id="custom-dialog-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[999999] hidden opacity-0 transition-opacity duration-300 flex items-center justify-center">
        <div id="custom-dialog" class="w-full max-w-sm bg-[#121217] border border-white/10 rounded-3xl shadow-2xl flex flex-col scale-95 transition-transform duration-300 p-6 relative overflow-hidden">
            <div id="dialog-color-bar" class="absolute top-0 left-0 right-0 h-1 bg-indigo-500"></div>
            <div class="flex items-center gap-3 mb-3 mt-2">
                <div id="dialog-icon" class="w-8 h-8 rounded-full flex items-center justify-center shrink-0"></div>
                <h2 id="dialog-title" class="text-[16px] font-bold text-white">提示</h2>
            </div>
            <p id="dialog-message" class="text-[13px] text-zinc-400 leading-relaxed mb-6">内容</p>
            <div class="flex gap-3 justify-end w-full mt-auto" id="dialog-buttons"></div>
        </div>
    </div>

    <div id="reject-modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[99999] hidden opacity-0 transition-opacity duration-300 flex items-center justify-center" onclick="if(event.target === this) window.closeActionModals()">
        <div id="reject-modal" class="hidden w-full max-w-lg bg-[#121217] border border-rose-500/30 rounded-3xl shadow-[0_20px_50px_-10px_rgba(244,63,94,0.2)] flex flex-col scale-95 transition-transform duration-300 p-6 relative">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-rose-500 to-orange-500 rounded-t-3xl"></div>
            <div class="flex justify-between items-center mb-4 mt-2">
                <h2 class="text-[16px] font-bold text-white" id="reject-title">提交修改意见</h2>
                <button onclick="window.closeActionModals()" class="text-zinc-500 hover:text-white bg-zinc-800 rounded-full p-1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
            </div>
            <textarea id="reject-reason" class="w-full bg-[#09090b] border border-zinc-700 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-rose-500 h-24 resize-none mb-4 custom-scrollbar" placeholder="请具体说明需要修改的内容。"></textarea>
            <button id="btn-reject-submit" onclick="window.submitReject()" class="w-full py-3.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-[13px] font-bold btn-press transition-all">提交修改意见</button>
        </div>
    </div>

    <div id="image-preview-modal" onclick="window.closePreview()">
        <div class="w-full h-full flex items-center justify-center relative p-8">
            <button onclick="window.closePreview()" class="absolute top-8 right-8 text-white/50 hover:text-white bg-white/10 hover:bg-rose-500 rounded-full p-2 transition-all btn-press z-50">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <img id="modal-image" src="" alt="全屏预览图" class="max-w-[90vw] max-h-[90vh] object-contain rounded-lg shadow-[0_0_50px_rgba(0,0,0,0.8)]" onclick="event.stopPropagation()">
        </div>
    </div>

    <div id="action-toast" class="fixed top-8 right-8 z-[1000] hidden toast-slide-in">
        <div class="bg-[#1a1a1f] border border-white/10 p-4 rounded-2xl shadow-2xl flex items-center gap-3 w-72">
            <div id="toast-icon" class="w-8 h-8 rounded-full flex items-center justify-center shrink-0"></div>
            <div><h4 id="toast-title" class="text-white text-sm font-bold">成功</h4><p id="toast-desc" class="text-zinc-400 text-[11px] mt-0.5">操作已执行。</p></div>
        </div>
    </div>

    <script src="./js/common.js?v=requester-hardboot-v4"></script>
    <script src="./js/task-detail-requester.js?v=requester-formal-v2"></script>
    <script src="./js/requester-init-guard-v2.js?v=requester-formal-v2"></script>
    <script src="https://bjzfkwxrvytgphvgwltl.supabase.co/functions/v1/uat-supabase-sdk-proxy?format=umd&v=20260820-v2"></script>
    <script type="module">
        import { supabase } from './supabase-config.js?v=requester-formal-v2';
        import * as aiRequirementClient from './js/ai-requirement-client.js?v=requester-formal-v2';
        import * as aiClarificationChat from './js/ai-clarification-chat.js?v=requester-formal-v2';
        window.supabase = supabase;
        window.aiRequirementClient = aiRequirementClient;
        window.aiClarificationChat = aiClarificationChat;
        window.DB_TABLE = 'test_tasks';
        if(window.initApp) window.initApp();
    </script>
</body>
</html>
