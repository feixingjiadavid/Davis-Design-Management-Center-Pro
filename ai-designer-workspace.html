<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI 设计工作台 - Davis Design UAT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#080b14;color:#e5e7eb;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
    .glass{background:rgba(17,24,39,.78);border:1px solid rgba(148,163,184,.14);box-shadow:0 18px 60px rgba(0,0,0,.25)}
    .task.active{background:#172554;border-color:#3b82f6}.task:hover{border-color:#475569}
    .step.done{color:#86efac;border-color:#166534;background:#052e16}.step.current{color:#bfdbfe;border-color:#2563eb;background:#172554}
    .btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}
    .spin{width:22px;height:22px;border-radius:999px;border:2px solid rgba(96,165,250,.22);border-top-color:#60a5fa;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body class="min-h-screen">
  <div class="fixed inset-0 pointer-events-none" style="background:radial-gradient(circle at 75% 8%,rgba(37,99,235,.22),transparent 32%),radial-gradient(circle at 10% 80%,rgba(14,165,233,.10),transparent 30%)"></div>
  <header class="relative h-20 px-8 flex items-center justify-between border-b border-white/10 bg-slate-950/70 backdrop-blur-xl">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-black shadow-lg shadow-blue-700/30">AI</div>
      <div><h1 class="font-bold text-lg text-white">Davis AI 设计工作台</h1><p class="text-xs text-blue-300">UAT 隔离测试环境 · AI 专属流程</p></div>
    </div>
    <div class="flex items-center gap-3"><span id="who" class="text-sm text-slate-400">身份验证中...</span><button id="logout" class="btn bg-slate-800 text-slate-300 hover:bg-slate-700">退出</button></div>
  </header>

  <main class="relative p-6 lg:p-8">
    <section class="glass rounded-2xl p-5 mb-6">
      <div class="flex items-center justify-between gap-4 mb-4">
        <div><p class="text-xs tracking-[.22em] text-blue-400 font-bold">AI DESIGN PIPELINE</p><h2 class="text-xl font-bold text-white mt-1">接单到测试验收的完整工作流</h2><p class="text-xs text-slate-500 mt-1">需求理解 → 框架生成 → 修改交付 → 最终验收</p></div>
        <span id="cloudStatus" class="text-xs px-3 py-1.5 rounded-full bg-slate-800 text-slate-400">连接 UAT...</span>
      </div>
      <div class="grid grid-cols-2 md:grid-cols-5 gap-3" id="pipeline">
        <div class="step rounded-xl border border-slate-700 bg-slate-900 p-3 text-sm">① 读取资料</div>
        <div class="step rounded-xl border border-slate-700 bg-slate-900 p-3 text-sm">② 理解并追问</div>
        <div class="step rounded-xl border border-slate-700 bg-slate-900 p-3 text-sm">③ 框架方案</div>
        <div class="step rounded-xl border border-slate-700 bg-slate-900 p-3 text-sm">④ 修改交付</div>
        <div class="step rounded-xl border border-slate-700 bg-slate-900 p-3 text-sm">⑤ 测试验收</div>
      </div>
    </section>

    <div class="grid lg:grid-cols-[340px_1fr] gap-6 min-h-[620px]">
      <aside class="glass rounded-2xl p-4">
        <div class="flex items-center justify-between mb-4"><h2 class="font-bold text-white">AI 待办需求</h2><button id="refresh" class="text-xs text-blue-400 hover:text-blue-300">刷新</button></div>
        <div id="taskList" class="space-y-3"><div class="text-sm text-slate-500 py-12 text-center">正在读取测试任务...</div></div>
      </aside>
      <section class="glass rounded-2xl p-5 lg:p-7" id="detail"><div class="h-full min-h-[520px] flex items-center justify-center text-slate-500">正在读取任务...</div></section>
    </div>
  </main>
  <div id="toast" class="hidden fixed right-6 bottom-6 max-w-sm px-5 py-4 rounded-xl border shadow-2xl text-sm z-50"></div>

  <script type="module">
    import { supabase } from './supabase-config.js?v=workspace-no-demo-preview-v6';
    import { loadAiRequirementState, invokeAiAction, SOURCE_STATUS_COPY, newIdempotencyKey } from './js/ai-requirement-client.js?v=workspace-seedream-v4';

    const AI_EMAIL='davis.design.ai@webank.com';
    const TASK_TABLE='test_tasks';
    const DEMO_MODEL='doubao-seedream-4-0-250828';
    const DEMO_PROMPT_VERSION='seedream-demo-design-director-v1';
    const STATUS_COPY={pending:'等待 AI 接单',pending_accept:'等待 AI 接单',processing:'AI 正在理解需求',needs_input:'等待需求方补充',understanding_ready:'理解完成',ready_for_demo:'框架生成已就绪',generating_demo:'框架方案正在生成',demo_review:'框架方案待确认',demo_failed:'框架方案生成失败',ready_for_final:'框架方案已确认',final_review:'成品待验收'};
    let currentUser=null,tasks=[],selectedId=null,busy=false,refreshTimer=null;
    const $=id=>document.getElementById(id);
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const notify=(msg,bad=false)=>{const t=$('toast');t.textContent=msg;t.className='fixed right-6 bottom-6 max-w-sm px-5 py-4 rounded-xl border shadow-2xl text-sm z-50 '+(bad?'bg-rose-950 border-rose-700 text-rose-200':'bg-emerald-950 border-emerald-700 text-emerald-200');setTimeout(()=>t.classList.add('hidden'),3500)};

    async function guard(){
      const {data:{session}}=await supabase.auth.getSession();
      if(!session){location.href='login.html';return false}
      currentUser=session.user;
      if(String(currentUser.email).toLowerCase()!==AI_EMAIL){location.href='index.html';return false}
      $('who').textContent=(currentUser.user_metadata?.displayName||'Davis AI')+' · AI 设计师';
      $('cloudStatus').textContent='UAT 已连接';$('cloudStatus').className='text-xs px-3 py-1.5 rounded-full bg-emerald-950 text-emerald-300';
      return true;
    }
    function selected(){return tasks.find(t=>t.id===selectedId)}
    function statusIndex(status,hasPreview){if(['completed','archived','reviewing'].includes(status))return 4;if(['final_review','ready_for_final','pending_approval'].includes(status))return 3;if(hasPreview||['generating_demo','demo_review','demo_failed'].includes(status))return 2;if(['processing','needs_input','understanding_ready','ready_for_demo'].includes(status))return 1;return 0}
    function paintPipeline(status,hasPreview){const idx=statusIndex(status,hasPreview);[...document.querySelectorAll('.step')].forEach((el,i)=>{el.classList.remove('done','current');if(i<idx)el.classList.add('done');else if(i===idx)el.classList.add('current')})}
    function scheduleRefresh(delay=1500){clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>loadTasks(true),delay)}

    async function loadTasks(silent=false){
      if(!silent)$('taskList').innerHTML='<div class="text-sm text-slate-500 py-12 text-center">正在读取测试任务...</div>';
      const {data,error}=await supabase.from(TASK_TABLE).select('*').eq('assignee','davis.design.ai').order('created_at',{ascending:false});
      if(error){$('taskList').innerHTML='<div class="text-sm text-rose-300 p-4 rounded-xl bg-rose-950/40">任务读取失败：'+esc(error.message)+'</div>';return}
      tasks=data||[];
      if(!tasks.length){$('taskList').innerHTML='<div class="text-sm text-slate-500 py-12 text-center">当前没有 AI 测试需求</div>';$('detail').innerHTML='<div class="h-full min-h-[520px] flex items-center justify-center text-slate-500">等待测试需求</div>';return}
      if(!selectedId||!tasks.some(t=>t.id===selectedId))selectedId=tasks[0].id;
      renderList();await renderDetail();
    }
    function renderList(){
      $('taskList').innerHTML=tasks.map(t=>'<button class="task '+(t.id===selectedId?'active':'')+' w-full text-left p-4 rounded-xl border border-slate-800 bg-slate-900/70 transition" data-id="'+esc(t.id)+'"><div class="flex justify-between gap-2"><span class="text-xs font-mono text-blue-400">'+esc(t.id)+'</span><span class="text-[11px] text-slate-500">'+esc(STATUS_COPY[t.status]||t.status)+'</span></div><h3 class="text-sm font-bold text-white mt-2 line-clamp-2">'+esc(t.title||'未命名测试需求')+'</h3><p class="text-xs text-slate-500 mt-2 line-clamp-2">'+esc(t.summary_desc||t.full_desc||'等待 AI 接单')+'</p></button>').join('');
      document.querySelectorAll('.task').forEach(el=>el.onclick=async()=>{selectedId=el.dataset.id;renderList();await renderDetail()});
    }
    const listHtml=(items,empty='未识别')=>(items&&items.length?'<ul class="space-y-1">'+items.map(x=>'<li>• '+esc(typeof x==='string'?x:(x.value||x.type||JSON.stringify(x)))+'</li>').join('')+'</ul>':'<span class="text-slate-500">'+empty+'</span>');
    function sourceCards(sources){if(!sources.length)return '<p class="text-sm text-slate-500">尚未建立资料快照。</p>';return '<div class="space-y-3">'+sources.map(source=>{const snapshot=(source.uat_source_snapshots||[]).find(x=>x.id===source.current_snapshot_id);return '<div class="rounded-lg border border-white/10 bg-slate-950/60 p-3"><div class="flex justify-between gap-3"><span class="text-sm font-bold text-slate-200">'+esc(source.source_type==='form_fields'?'需求单字段':'腾讯文档')+'</span><span class="text-xs '+(source.status==='ready'?'text-emerald-400':'text-amber-300')+'">'+esc(SOURCE_STATUS_COPY[source.status]||source.status)+'</span></div>'+(snapshot?'<p class="text-xs text-slate-500 mt-2">'+snapshot.character_count+' 字 · '+snapshot.table_count+' 表格 · '+snapshot.image_count+' 图片 · '+new Date(snapshot.read_at).toLocaleString()+'</p>':'')+'</div>'}).join('')+'</div>'}
    function briefHtml(analysis){if(!analysis)return '<p class="text-sm text-slate-500">尚未生成理解单。</p>';const b=analysis.brief||{};return '<div class="grid md:grid-cols-2 gap-4 text-sm"><div><p class="text-slate-500 mb-1">目标</p><p class="text-white">'+esc(b.goal||'--')+'</p></div><div><p class="text-slate-500 mb-1">需求理解程度</p><p class="text-emerald-300 font-bold">理解清楚</p><p class="text-xs text-slate-500 mt-1">AI 对当前需求的理解把握较高（'+esc(Math.round((b.confidence||0)*100))+'%）</p></div><div><p class="text-slate-500 mb-1">尺寸</p>'+listHtml(b.dimensions)+'</div><div><p class="text-slate-500 mb-1">渠道</p>'+listHtml(b.channels)+'</div><div><p class="text-slate-500 mb-1">版式规划</p>'+listHtml(b.layout_plan)+'</div><div><p class="text-slate-500 mb-1">禁止项/限制</p>'+listHtml(b.constraints)+'</div></div>'}

    function latestDemoRows(generations){
      const rows=(generations||[]).filter(g=>g.kind==='demo'&&g.model===DEMO_MODEL&&g.prompt_version===DEMO_PROMPT_VERSION).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
      const byPage=new Map();for(const row of rows)byPage.set(Number(row.page_index||1),row);return [...byPage.values()].sort((a,b)=>Number(a.page_index||1)-Number(b.page_index||1));
    }
    function demoHtml(task,rows,analysis){
      const target=(analysis?.brief?.dimensions||[]).join('、')||'1242×1660';
      const total=Math.max(1,Number(analysis?.brief?.pages?.length||rows[0]?.page_count||3));
      const failed=[...rows].reverse().find(r=>r.status==='failed');
      const generating=rows.find(r=>r.status==='generating');
      const ready=rows.filter(r=>['ready','confirmed'].includes(r.status));
      if(generating||task.status==='generating_demo'){
        const current=Number(generating?.page_index||Math.min(total,ready.length+1));
        const started=Date.parse(rows[0]?.created_at||'');const elapsed=Number.isFinite(started)?Math.max(0,Math.floor((Date.now()-started)/1000)):0;
        const pills=Array.from({length:total},(_,i)=>{const page=i+1,row=rows.find(r=>Number(r.page_index)===page);let txt='○ 第 '+page+' 页 等待',cls='border-white/10 text-slate-500';if(row?.status==='generating'){txt='● 第 '+page+' 页 生成中';cls='border-blue-500/30 text-blue-200 bg-blue-950/20'}if(['ready','confirmed'].includes(row?.status)){txt='✓ 第 '+page+' 页 已完成';cls='border-emerald-500/25 text-emerald-300 bg-emerald-950/20'}if(row?.status==='failed'){txt='× 第 '+page+' 页 失败';cls='border-rose-500/25 text-rose-300 bg-rose-950/20'}return '<div class="rounded-lg border '+cls+' p-2 text-[11px]">'+txt+'</div>'}).join('');
        return '<div class="space-y-4"><div class="flex items-center gap-3"><div class="spin"></div><div class="flex-1"><div class="flex justify-between gap-3"><p class="text-sm font-bold text-blue-200">第 '+current+' / '+total+' 页生成中</p><span class="text-[11px] text-slate-500">已耗时 '+elapsed+'s</span></div><p class="text-xs text-slate-500 mt-1">请求已发出，正在读取真实生成状态。</p></div></div><div class="grid grid-cols-3 gap-2">'+pills+'</div><p class="text-xs text-slate-500">目标尺寸：<span class="text-slate-300">'+esc(target)+'</span></p></div>';
      }
      if(failed||task.status==='demo_failed'){
        return '<div class="rounded-xl border border-rose-500/25 bg-rose-950/20 p-5"><p class="text-sm font-bold text-rose-300">框架方案生成失败</p><p class="text-xs text-rose-200/75 mt-2 break-words">'+esc(failed?.error_message||task.summary_desc||'生成失败')+'</p><p class="text-[11px] text-slate-500 mt-3">已成功页面保留；只有点击后才会再次调用生成。</p><button id="demoStartBtn" class="btn bg-violet-600 hover:bg-violet-500 text-white mt-4">重新生成框架方案</button></div>';
      }
      if(rows.length&&ready.length===rows.length&&ready.length>=total){
        return '<div class="space-y-3"><p class="text-sm font-bold text-emerald-400">本轮图片生成已完成 '+ready.length+' / '+total+'</p><p class="text-xs text-slate-500">正式图片请在下方“设计生成历史”查看。</p></div>';
      }
      return '<div class="rounded-xl border border-blue-500/20 bg-blue-950/15 p-5"><div class="flex items-start gap-3"><div class="w-8 h-8 rounded-full border border-blue-500/30 bg-blue-500/10 flex items-center justify-center text-blue-300">✓</div><div class="flex-1"><p class="text-sm font-bold text-blue-200">框架方案生成已就绪</p><p class="text-xs text-slate-400 mt-2">需求理解、参考图和必用素材已准备完成。点击后才会发起本次生成。</p><p class="text-[11px] text-slate-500 mt-2">目标尺寸：'+esc(target)+' · 预计 '+total+' 页</p><button id="demoStartBtn" class="btn bg-violet-600 hover:bg-violet-500 text-white mt-4">开始生成框架方案</button></div></div></div>';
    }

    async function renderDetail(){
      const task=selected();if(!task)return;
      let state={sources:[],analysis:null,clarifications:[],generations:[]},stateError='';try{state=await loadAiRequirementState(supabase,task.id,task.link)}catch(e){stateError=e.message}
      const rows=latestDemoRows(state.generations);const analysis=state.analysis;const openQuestions=state.clarifications.filter(q=>q.status==='open');
      paintPipeline(task.status,rows.length>0);
      $('detail').innerHTML='<div class="flex flex-wrap items-start justify-between gap-4 border-b border-white/10 pb-5"><div><p class="text-xs font-mono text-blue-400">'+esc(task.id)+'</p><h2 class="text-2xl font-bold text-white mt-2">'+esc(task.title)+'</h2><p class="text-sm text-slate-400 mt-2">'+esc(task.project||'AI UAT')+' · 需求方 '+esc(task.creator||'uat.requester')+'</p></div><span class="px-3 py-1.5 rounded-full bg-blue-950 text-blue-300 text-xs">'+esc(STATUS_COPY[task.status]||task.status)+'</span></div><div class="grid xl:grid-cols-[1fr_420px] gap-6 mt-6"><div class="space-y-5"><div class="rounded-xl bg-slate-900/70 border border-white/5 p-5"><h3 class="text-sm font-bold text-white mb-3">原始需求</h3><p class="text-sm leading-7 text-slate-300 whitespace-pre-wrap">'+esc(task.full_desc||'未填写需求描述')+'</p></div><div class="rounded-xl bg-slate-900/70 border border-white/5 p-5"><h3 class="text-sm font-bold text-white mb-3">资料读取</h3>'+sourceCards(state.sources)+'</div><div class="rounded-xl bg-slate-900/70 border border-white/5 p-5"><h3 class="text-sm font-bold text-white mb-3">AI 如何理解需求</h3>'+briefHtml(analysis)+'</div><div class="rounded-xl bg-slate-900/70 border border-white/5 p-5"><h3 class="text-sm font-bold text-white mb-3">需要补充的问题</h3>'+(openQuestions.length?listHtml(openQuestions.map(q=>q.question)):'<p class="text-sm text-emerald-400">当前没有未回答问题。</p>')+'</div>'+(stateError?'<p class="text-xs text-rose-300">状态读取失败：'+esc(stateError)+'</p>':'')+'<div class="flex gap-3"><button id="readBtn" class="btn bg-slate-700 hover:bg-slate-600 text-white">重新读取资料（排障）</button><button id="retryBtn" class="btn bg-slate-800 hover:bg-slate-700 text-slate-200">刷新状态</button></div><p class="text-xs text-slate-500">图片不会自动生成，也不会自动重试；每次图像调用都由你手动触发。</p></div><div class="space-y-5"><div class="rounded-xl bg-slate-950 border border-white/10 p-4 min-h-[250px]"><h3 class="text-sm font-bold text-white mb-3">生成进度</h3>'+demoHtml(task,rows,analysis)+'</div><div class="rounded-xl bg-slate-950 border border-white/10 p-4 min-h-[250px]"><h3 class="text-sm font-bold text-white mb-3">正式版本图片</h3><div class="h-[190px] flex items-center justify-center text-center text-slate-600">每轮正式图片统一在下方“设计生成历史”查看</div></div></div></div>';
      $('readBtn').onclick=()=>invoke('read_sources');$('retryBtn').onclick=()=>loadTasks(false);if($('demoStartBtn'))$('demoStartBtn').onclick=()=>startDemo(analysis);
      if(task.status==='generating_demo'||rows.some(r=>r.status==='generating'))scheduleRefresh();else clearTimeout(refreshTimer);
    }

    async function startDemo(analysis){
      if(busy||!analysis?.id)return;busy=true;const btn=$('demoStartBtn');if(btn){btn.disabled=true;btn.textContent='请求已发出，等待 Seedream…'}
      try{const task=selected();await invokeAiAction(supabase,task.id,'generate_demo',{analysis_id:analysis.id,idempotency_key:newIdempotencyKey()});notify('框架方案生成完成');await loadTasks(true)}catch(e){notify('框架方案生成失败：'+e.message,true);await loadTasks(true)}finally{busy=false}
    }
    async function invoke(action,payload={}){if(busy)return;busy=true;try{const task=selected();await invokeAiAction(supabase,task.id,action,payload);notify('操作完成');await loadTasks(true)}catch(e){notify('操作失败：'+e.message,true);await renderDetail()}finally{busy=false}}

    $('refresh').onclick=()=>loadTasks(false);$('logout').onclick=async()=>{await supabase.auth.signOut();localStorage.removeItem('activeUserObj');location.href='login.html'};
    if(await guard())await loadTasks();
  </script>
</body>
</html>
